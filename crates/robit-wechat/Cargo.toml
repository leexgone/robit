[package]
name = "robit-wechat"
version.workspace = true
edition.workspace = true
description = "WeChat iLink Bot platform frontend for the robit agent."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["llm", "agent", "wechat", "bot"]
categories = ["command-line-utilities"]

[[bin]]
name = "robit-wechat"
path = "src/main.rs"

[dependencies]
robit-chatbot = { workspace = true }
robit-agent = { workspace = true }
robit-ai = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "io-std", "io-util"] }
tokio-util.workspace = true
weixin-agent.workspace = true
qrcode.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
toml.workspace = true
