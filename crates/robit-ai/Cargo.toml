[package]
name = "robit-ai"
version.workspace = true
edition.workspace = true
description = "Multi-provider LLM API and configuration layer for robit."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["llm", "ai", "agent", "openai"]
categories = ["api-bindings", "config"]

[dependencies]
async-openai.workspace = true
# 流式旁路：自收 SSE 帧以捕获 async-openai typed 结构装不下的厂商扩展字段
# （reasoning_content 等）；标准字段仍委托 async-openai 类型反序列化。
reqwest = { workspace = true, features = ["stream"] }
eventsource-stream.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
dirs.workspace = true

[dev-dependencies]
reqwest.workspace = true
tokio.workspace = true
wiremock = "0.6"
futures-util.workspace = true
serde_json.workspace = true
