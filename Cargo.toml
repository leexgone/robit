[workspace]
members = [
    "crates/robit-ai",
    "crates/robit-agent",
    "crates/robit-tui",
    "crates/robit-gui",
    "crates/robit-chatbot",
    "crates/robit-qq",
    "examples/robit-chat",
    "examples/robit-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.19"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/leexgone/robit"
homepage = "https://github.com/leexgone/robit"

[workspace.dependencies]
# 内部 crates
robit-ai = { path = "crates/robit-ai", version = "0.1.19" }
robit-agent = { path = "crates/robit-agent", version = "0.1.19" }
robit-chatbot = { path = "crates/robit-chatbot", version = "0.1.19" }

# 异步运行时（按需启用 feature，避免 full 带来的冗余编译）
tokio = { version = "1", features = [
    "rt-multi-thread",  # 多线程运行时
    "macros",           # #[tokio::main] / #[tokio::test]
    "sync",             # mpsc, Mutex, RwLock, oneshot 等同步原语
    "time",             # sleep, timeout, Duration
    "fs",               # 异步文件操作
    "io-util",          # AsyncReadExt / AsyncWriteExt 等扩展 trait
    "io-std",           # stdin / stdout / stderr 异步 IO
] }
async-trait = "0.1"
futures-util = "0.3"
tokio-util = "0.7"
# WebSocket（robit-qq 使用）
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
# HTTP 客户端（默认用 rustls，纯 Rust 实现，避免 OpenSSL C 编译依赖）
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }

# 编码
base64 = "0.23"
bytes = "1.0"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1.1"

# LLM API
async-openai = { version = "0.41", features = ["chat-completion"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }

# 错误处理
thiserror = "2"
anyhow = "1"

# 工具库
dirs = "6"
dotenvy = "0.15"
uuid = { version = "1.23", features = ["v4"] }
globset = "0.4"
regex = "1"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
rusqlite = { version = "0.40", features = ["bundled", "bundled-full"] }
fs2 = "0.4"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2.2"
pulldown-cmark = "0.13"

# CLI
clap = { version = "4.6", features = ["derive"] }
