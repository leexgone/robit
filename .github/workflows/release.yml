name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # -----------------------------------------------------------------------
  # Publish library crates to crates.io (dependency order, skip existing)
  # -----------------------------------------------------------------------
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Read the unified version from workspace Cargo.toml.
          VERSION=$(grep '^version\s*=' Cargo.toml | head -1 | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Cannot read version from workspace Cargo.toml"
            exit 1
          fi
          echo "Workspace version: $VERSION"

          # Crates in dependency order: leaf deps first, dependents last.
          # robit-gui is excluded (publish = false).
          CRATES=(
            "crates/robit-ai:robit-ai"
            "crates/robit-agent:robit-agent"
            "crates/robit-chatbot:robit-chatbot"
            "crates/robit-web:robit-web"
            "crates/robit-tui:robit"
            "crates/robit-qq:robit-qq"
            "crates/robit-wechat:robit-wechat"
          )

          for entry in "${CRATES[@]}"; do
            IFS=":" read -r path name <<< "$entry"

            # Skip crates marked publish = false.
            if grep -qE 'publish\s*=\s*false' "$path/Cargo.toml"; then
              echo "[skip] $name (publish = false)"
              continue
            fi

            # Check whether this version is already on crates.io.
            if curl -sf "https://crates.io/api/v1/crates/$name" \
               | grep -q "\"num\":\"$VERSION\""; then
              echo "[ok]   $name v$VERSION already published, skipping"
              continue
            fi

            echo "[pub]  Publishing $name v$VERSION ..."
            (cd "$path" && cargo publish --no-verify)

            echo "[ok]   $name v$VERSION published"
            # Give the crates.io index time to propagate before the next crate.
            sleep 15
          done

          echo "[done] All crates processed"

  build-cli:
    name: Build CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: robit
            archive: robit-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: robit.exe
            archive: robit-windows-x86_64.zip
          - name: macos-aarch64
            os: macos-latest
            binary: robit
            archive: robit-macos-aarch64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build robit CLI
        run: cargo build -p robit --release

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/
          tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.binary }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ matrix.binary }}" dist/
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload CLI asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}

  build-qq-bot:
    name: Build QQ Bot (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: robit-qq
            archive: robit-qq-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: robit-qq.exe
            archive: robit-qq-windows-x86_64.zip
          - name: macos-aarch64
            os: macos-latest
            binary: robit-qq
            archive: robit-qq-macos-aarch64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build robit-qq
        run: cargo build -p robit-qq --release

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/
          tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.binary }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ matrix.binary }}" dist/
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload QQ Bot asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}

  build-wechat-bot:
    name: Build WeChat Bot (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            binary: robit-wechat
            archive: robit-wechat-linux-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            binary: robit-wechat.exe
            archive: robit-wechat-windows-x86_64.zip
          - name: macos-aarch64
            os: macos-latest
            binary: robit-wechat
            archive: robit-wechat-macos-aarch64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build robit-wechat
        run: cargo build -p robit-wechat --release

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/
          tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.binary }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/release/${{ matrix.binary }}" dist/
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload WeChat Bot asset
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}

  build-gui:
    name: Build GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/robit-gui/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/robit-gui/ui
        # Install strictly from the committed package-lock.json (public npm
        # registry). The lock pins @tauri-apps/* versions that must stay on the
        # same major.minor as the Rust crates in Cargo.lock (tauri,
        # tauri-plugin-shell) — the Tauri CLI rejects mismatched pairs. When
        # upgrading Tauri deps, update both sides in the same commit.
        run: npm ci

      - name: Build frontend
        working-directory: crates/robit-gui/ui
        run: npm run build

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.0.0

      - name: Build Tauri app
        working-directory: crates/robit-gui
        run: tauri build --verbose

      - name: Upload GUI assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.app.tar.gz
            target/release/bundle/**/*.sig
            crates/robit-gui/target/release/bundle/**/*.AppImage
            crates/robit-gui/target/release/bundle/**/*.deb
            crates/robit-gui/target/release/bundle/**/*.rpm
            crates/robit-gui/target/release/bundle/**/*.dmg
            crates/robit-gui/target/release/bundle/**/*.msi
            crates/robit-gui/target/release/bundle/**/*.exe
            crates/robit-gui/target/release/bundle/**/*.app.tar.gz
            crates/robit-gui/target/release/bundle/**/*.sig
